<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备信息弹窗</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        .popup-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 99;
            pointer-events: auto;
            background: url('/assets/img/modelHtml/bg.png') no-repeat center center;
            background-size: cover;
            transition: background 0.3s ease;
            min-height: 506px;
        }

        .popup-container.alarm {
            background: url('/assets/img/modelHtml/bg2.png') no-repeat center center;
            background-size: cover;
        }

        .model-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-title {
            padding-left: 85px;
            padding-top: 10px;
            margin-top: 20px;
            font-size: 28px;
            color: #fff;
            height: 52px;
            background: url('/assets/img/modelHtml/titleBg.png') no-repeat center center;
            display: flex;
            align-items: center;
            justify-content: space-between; 
            background-size: cover;
            transition: background 0.3s ease;
        }

        .info-title.alarm-title {
            background: url('/assets/img/modelHtml/titleBg2.png') no-repeat center center;
            background-size: cover;
        }

        .info-close {
            width: 48px;
            height: 48px;
            margin-right: 20px;
            background: url('/assets/img/modelHtml/close.png') no-repeat center center;
            background-size: cover;
        }

        .info-list {
            margin-left: 25px;
            margin-top: 30px;
            width: 95%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 16px;
        }

        .info-item {
            width: 100%;
            height: 50px;
            background: url('/assets/img/modelHtml/2.png') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 23px 0 15px;
            box-sizing: border-box;
        }

        .info-item span {
            font-size: 24px;
            color: #fff;
            opacity: 0.8;
        }

        .info-item:last-child span:last-child {
            font-weight: bold;
            color: #62EFD3;
        }

        .info-item .alarm-danger {
            color: #FF6969 !important;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="popup-container" :class="{ 'alarm': hasAlarm }">
            <div class="model-card">
                <div class="info-title" :class="{ 'alarm-title': hasAlarm }">
                    <div>{{ data.title }}</div>
                    <div class="info-close" @click="handleClose"></div>
                </div>
                <div class="info-list">
                    <div class="info-item" v-for="(item, index) in data.data" :key="item.title" :class="{'alarm-danger': hasAlarm}">
                        <span>{{ item.title }}</span>
                        <span v-if="index === data.data.length - 1" :class="{'alarm-danger': hasAlarm}">
                            {{ item.content }}
                        </span>
                        <span v-else >{{ item.content }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 环境配置
        window.__ENV = {
            API1_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://10.1.10.91:8099'
                : 'http://192.168.3.99:8099'
        };

        const { createApp, ref, onMounted, onUnmounted } = Vue;

        // 获取URL参数
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // API请求函数
        async function getEnvironmentalDeviceById(params) {
            const apiUrl = window.__ENV.API1_URL;
            const response = await axios.get(apiUrl + '/environmentalSupervision/getEnvironmentalDeviceById', { params });
            return response.data;
        }

        async function getEnvMonitoring(params) {
            const apiUrl = window.__ENV.API1_URL;
            const response1 = await axios.get(apiUrl + '/environmentalSupervision/environmentalMonitoring', { params });
            return response1.data;
        }

        createApp({
            setup() {
                const hasAlarm = ref(false);
                let timer = null; // 定时器变量

                // 获取URL参数
                const id = getUrlParameter('deviceId');
                const deviceName = getUrlParameter('deviceName');
                const planeId = getUrlParameter('planeId');

                const data = ref({
                    title: '设备信息',
                    data: [
                        { title: '设备名称', content: id },
                        { title: '设备编号', content: deviceName },
                        { title: '报警状态', content: '--' }
                    ],
                });

                // 获取设备数据并更新UI的函数
                const fetchDeviceData = async () => {
                    if (!id) return;

                    try {
                        // 同时请求设备信息和所有实时数据
                        const [deviceRes, monitorRes] = await Promise.all([
                            getEnvironmentalDeviceById({ id }),
                            getEnvMonitoring()
                        ]);

                        if (deviceRes.code === 200 && monitorRes.code === 200) {
                            const deviceData = deviceRes.data;
                            const monitorData = monitorRes.data.find(item => item.deviceId === id);

                            const infoItems = [
                                { title: '设备编号', content: id },
                                { title: '设备名称', content: deviceName },
                                { title: '设备地址', content: deviceData.devaddr || '--' },
                            ];

                            // 检查是否有报警
                            let alarmStatus = false;

                            // 添加监测因子信息
                            if (deviceData.factorList && deviceData.factorList.length > 0) {
                                deviceData.factorList.forEach(factor => {
                                    const value = monitorData ? monitorData[factor.factor] : undefined;
                                    const displayValue = value !== undefined && value !== null ? value : '--';

                                    infoItems.push({
                                        title: factor.factorText,
                                        content: `${displayValue} ${factor.factorUnit}`
                                    });

                                    // 检查报警状态
                                    if (factor.alarm === 'true' || factor.alarm === true) {
                                        alarmStatus = true;
                                    }
                                });
                            }

                            // 添加报警类型信息
                            infoItems.push({
                                title: '报警类型',
                                content: alarmStatus ? '超标' : '正常'
                            });

                            // 更新数据
                            data.value.data = infoItems;
                            hasAlarm.value = alarmStatus;
                        } else {
                            throw new Error('获取数据失败');
                        }
                    } catch (error) {
                        console.error('请求失败:', error);
                        data.value.data = [
                            { title: '设备名称', content: id },
                            { title: '设备编号', content: deviceName },
                            { title: '报警状态', content: '--' }
                        ];
                        hasAlarm.value = false;
                    }
                };

                const handleClose = () => {
                    if (timer) {
                        clearInterval(timer);
                        timer = null;
                    }
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage({ type: 'model-popup-close', planeId, deviceId: id }, '*');
                        }
                    } catch (e) {
                    }
                };

                // 组件挂载时
                onMounted(() => {
                    // 立即执行一次数据获取
                    fetchDeviceData();
                    
                    // 设置定时器，每5分钟执行一次
                    timer = setInterval(() => {
                        fetchDeviceData();
                    }, 300000);
                });

                // 组件卸载时清除定时器
                onUnmounted(() => {
                    if (timer) {
                        clearInterval(timer);
                        timer = null;
                    }
                });

                return {
                    data,
                    hasAlarm,
                    handleClose
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
